<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>viewport check (temporary)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b10; }
  .wrap { padding: 8px; }
  iframe { display: block; border: 0; background: #fff; }
</style>
</head>
<body>
  <div class="wrap"><iframe id="frame" src="/" width="1440" height="900" title="viewport preview"></iframe></div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var f = document.getElementById('frame');
      if (p.get('w')) f.setAttribute('width', p.get('w'));
      if (p.get('h')) f.setAttribute('height', p.get('h'));
      if (p.get('src')) f.setAttribute('src', p.get('src'));
    })();
  </script>
</body>
</html>
