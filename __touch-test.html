<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>hero-canvas touch test</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .hero { position: relative; width: 100%; height: 600px; overflow: hidden;
            background: linear-gradient(158deg, #2b2039 0%, #3a2c50 54%, #221929 100%); }
    #hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.9; }
    #result { position: relative; z-index: 2; color: #fff; font: 14px/1.6 -apple-system, sans-serif; padding: 20px; }
</style>
</head>
<body>
<section class="hero">
    <canvas id="hero-canvas" aria-hidden="true"></canvas>
    <div id="result">running…</div>
</section>
<script src="hero-canvas.js"></script>
<script>
(function () {
    var hero = document.querySelector('.hero');
    var canvas = document.getElementById('hero-canvas');
    var out = document.getElementById('result');
    var log = [];

    function region(px, py) {
        var ctx = canvas.getContext('2d');
        var r = canvas.width / canvas.clientWidth;
        var x = Math.round(px * r), y = Math.round(py * r), s = Math.round(50 * r);
        x = Math.max(s, Math.min(canvas.width - s, x));
        y = Math.max(s, Math.min(canvas.height - s, y));
        var d = ctx.getImageData(x - s, y - s, s * 2, s * 2).data;
        var sum = 0;
        for (var i = 3; i < d.length; i += 4) sum += d[i];
        return +(sum / (d.length / 4)).toFixed(2);
    }

    function fire(type, x, y) {
        var t = new Touch({ identifier: 1, target: hero, clientX: x, clientY: y, pageX: x, pageY: y, screenX: x, screenY: y, radiusX: 8, radiusY: 8, force: 1 });
        var empty = type === 'touchend';
        hero.dispatchEvent(new TouchEvent(type, {
            bubbles: true, cancelable: true,
            touches: empty ? [] : [t],
            targetTouches: empty ? [] : [t],
            changedTouches: [t]
        }));
    }

    var TX = 240, TY = 380;

    setTimeout(function () {
        log.push('canvas ' + canvas.width + 'x' + canvas.height + ' / css ' + canvas.clientWidth + 'x' + canvas.clientHeight);
        var before = region(TX, TY);
        log.push('before touch: avgAlpha ' + before);

        try {
            fire('touchstart', TX, TY);
            fire('touchmove', TX + 4, TY + 4);
            log.push('touchstart/touchmove dispatched OK');
        } catch (e) {
            log.push('touch dispatch FAILED: ' + e);
        }

        setTimeout(function () {
            var during = region(TX, TY);
            log.push('after touch: avgAlpha ' + during + ' (delta ' + (during - before).toFixed(2) + ')');
            log.push(during > before + 1 ? 'RESULT: TOUCH REACTS' : 'RESULT: TOUCH NO VISIBLE CHANGE');
            var a = region(60, 60), b = region(60, 60);
            log.push('frame samples ' + a + ' / ' + b + (a !== b ? ' (animating)' : ' (static?)'));
            out.textContent = log.join('\n');
            document.title = during > before + 1 ? 'TOUCH-OK' : 'TOUCH-FAIL';
        }, 320);
    }, 400);
})();
</script>
</body>
</html>
